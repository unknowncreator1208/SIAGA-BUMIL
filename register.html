<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register SIAGA BUMIL</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-container">

<h1>DAFTAR AKUN</h1>

<p>SIAGA BUMIL</p>

<hr>

<label>Nama Lengkap</label>

<input
type="text"
id="nama"
placeholder="Nama Lengkap">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Email">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Minimal 6 karakter">

<label>Konfirmasi Password</label>

<input
type="password"
id="konfirmasi"
placeholder="Ulangi Password">

<button
type="button"
onclick="register()">

DAFTAR

</button>

<br><br>

<a href="login.html">

Sudah punya akun?

Login

</a>

</div>

<script type="module" src="js/firebase.js"></script>

<script type="module" src="js/auth.js"></script>

</body>

</html>
