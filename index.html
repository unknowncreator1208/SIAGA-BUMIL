<!DOCTYPE html>
<html>

<head>
    <title>SIAGA BUMIL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>SIAGA BUMIL</h1>

<h1>DESA ISIMU SELATAN</h1>

<p>Sistem Informasi Siaga Ibu Hamil</p>

</header>

<nav>

<a href="#">Beranda</a>

<a href="#">Pemeriksaan</a>

<a href="#">Tentang</a>

</nav>

<section>

<h2>Form Pemeriksaan Ibu Hamil</h2>

<form id="formBumil">

<label>Nama Lengkap</label><br>
<input type="text" id="nama"><br><br>

<label>Umur</label><br>
<input type="number" id="umur"><br><br>

<label>Usia Kehamilan (Minggu)</label><br>
<input type="number" id="usiaKehamilan"><br><br>

<label>Berat Badan (kg)</label><br>
<input type="number" id="berat"><br><br>

<label>Tinggi Badan (cm)</label><br>
<input type="number" id="tinggi"><br><br>

<label>Tanggal Pemeriksaan</label><br>
<input type="date" id="tanggal"><br><br>

<label>Tekanan Darah</label><br>
<input type="text" id="tekananDarah"><br><br>

<label>Riwayat Hipertensi</label><br>

<input type="radio" name="hipertensi" value="Ya"> Ya

<input type="radio" name="hipertensi" value="Tidak"> Tidak

<br><br>

<label>Riwayat Diabetes</label><br>

<input type="radio" name="diabetes" value="Ya"> Ya

<input type="radio" name="diabetes" value="Tidak"> Tidak

<br><br>

<label>Perdarahan/Riwayat Perdarahan</label><br>

<input type="radio" name="perdarahan" value="Ya"> Ya

<input type="radio" name="perdarahan" value="Tidak"> Tidak

<br><br>

<label>Jumlah Kehamilan</label><br>

<input type="number" id="jumlahKehamilan"><br><br>

<label>Nomor HP/WA Aktif</label><br>

<input type="text" id="nomorHP"><br><br>

<label>Alamat</label><br>

<textarea id="alamat"></textarea>

<label>Keluhan</label><br>
<textarea id="keluhan"></textarea><br><br>

<br><br>

<button type="button" onclick="ambilData()">

Hitung Risiko

</button>

</form>

<hr>

<h2>Hasil Pemeriksaan</h2>

<p id="hasil"></p>

</section>
