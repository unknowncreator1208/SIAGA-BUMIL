<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Kelola Akun Petugas - SIAGA BUMIL
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard-nakes.css"
    >

</head>


<body>


<div class="container">

    <h1>
        👨‍⚕️ Kelola Akun Petugas
    </h1>

    <hr>


    <!-- ==================================
         TAMBAH PETUGAS
    =================================== -->

    <h2>
        Tambah Bidan / Kader
    </h2>


    <label>
        Nama
    </label>

    <input
        type="text"
        id="nama"
        placeholder="Nama lengkap petugas"
    >


    <label>
        Email
    </label>

    <input
        type="email"
        id="email"
        placeholder="Email petugas"
    >


    <label>
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Minimal 6 karakter"
    >


    <label>
        Role
    </label>

    <select id="role">

        <option value="bidan">
            Bidan
        </option>

        <option value="kader">
            Kader
        </option>

    </select>


    <button
        type="button"
        onclick="tambahPetugas()"
    >

        ➕ Tambah Akun

    </button>


    <hr>


    <!-- ==================================
         DAFTAR PETUGAS
    =================================== -->

    <h2>
        📋 Daftar Petugas
    </h2>


    <div class="table-wrapper">

        <table
            id="tabelPetugas"
            width="100%"
        >

            <thead>

                <tr>

                    <th>
                        No
                    </th>

                    <th>
                        Nama
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Role
                    </th>

                    <th>
                        Aksi
                    </th>

                </tr>

            </thead>


            <tbody>

                <tr>

                    <td
                        colspan="5"
                        style="text-align:center;"
                    >

                        Memuat data...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <br>


    <button
        type="button"
        onclick="window.history.back()"
    >

        ⬅ Kembali

    </button>


</div>


<script
    type="module"
    src="../js/kelola-akun.js"
></script>


</body>

</html>
