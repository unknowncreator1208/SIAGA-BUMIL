<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil Saya</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container">

<h1>👤 Profil Saya</h1>

<form id="formProfil">

<h2 class="section-title">
    👩 Identitas Ibu Hamil
</h2>

<label>Nama Lengkap</label>

<input type="text" id="nama">

<label>Umur</label>

<input type="number" id="umur">

<label>NIK</label>

<input type="text" id="nik">

<label>Tanggal Lahir</label>

<input type="date" id="tanggalLahir">

<label>Usia Kehamilan (Minggu)</label>

<input type="number" id="usiaKehamilan">

<label>Jumlah Kehamilan</label>

<input
type="number"
id="jumlahKehamilan"
min="1"
placeholder="Contoh : 1">

<label>Berat Badan (kg)</label>

<input
type="number"
id="beratBadan"
step="0.1"
placeholder="Contoh : 60">

<label>Tinggi Badan (cm)</label>

<input
type="number"
id="tinggiBadan"
step="0.1"
placeholder="Contoh : 160">

<label>Lingkar Lengan Atas (LILA) (cm)</label>

<input
type="number"
id="lila"
step="0.1"
placeholder="Contoh : 24">

<label>Golongan Darah</label>

<select id="golonganDarah">

<option value="O">O</option>
<option value="A">A</option>
<option value="B">B</option>
<option value="AB">AB</option>

</select>

<label>Nomor HP</label>

<input type="text" id="nomorHP">

<label>Alamat</label>

<textarea id="alamat"></textarea>

<label>Perkiraan Hari Lahir (HPL)</label>

<input type="date" id="hpl">

<br><br>

<hr>

<h2 class="section-title">
    👨 Identitas Suami / Pendamping
</h2>

<div class="pendamping-section">

    <label>Nama Suami / Pendamping</label>

    <input
        type="text"
        id="namaPendamping"
        placeholder="Masukkan nama suami / pendamping"
    >


    <label>Hubungan dengan Ibu</label>

    <select id="hubunganPendamping">

        <option value="">Pilih hubungan</option>

        <option value="Suami">Suami</option>

        <option value="Orang Tua">Orang Tua</option>

        <option value="Anak">Anak</option>

        <option value="Saudara">Saudara</option>

        <option value="Lainnya">Lainnya</option>

    </select>


    <label>Nomor HP Suami / Pendamping</label>

    <input
        type="tel"
        id="nomorHPPendamping"
        placeholder="Masukkan nomor HP"
    >


    <label>Alamat Suami / Pendamping</label>

    <textarea
        id="alamatPendamping"
        placeholder="Masukkan alamat"
    ></textarea>

</div>

<button type="button" onclick="simpanProfil()">
    💾 Simpan Profil

</button>

<br><br>

<button type="button" onclick="window.location.href='../dashboard/dashboard.html'" class="btn-kembali">

⬅ Kembali ke Dashboard

</button>

</form>

</div>

<script type="module" src="../js/firebase.js"></script>
<script type="module" src="../js/profil-firebase.js"></script>

</body>

</html>
