<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Riwayat Persalinan - SIAGA BUMIL</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard-nakes.css"
    >

</head>


<body>

<header class="topbar">

    <div>

        <h2>
            🏥 Riwayat Persalinan
        </h2>

    </div>


    <button
        class="logout-btn"
        id="btnLogout">

        Logout

    </button>

</header>


<div class="container">

    <h1>
        Riwayat Persalinan
    </h1>

    <p>
        Daftar ibu hamil yang telah menyelesaikan persalinan.
    </p>


    <div class="search-box">

        <input
            type="text"
            id="searchPersalinan"
            placeholder="🔎 Cari nama ibu..."
        >

    </div>


    <div class="table-wrapper">

        <table id="tabelPersalinan">

            <thead>

                <tr>

                    <th>No</th>

                    <th>Nama Ibu</th>

                    <th>Umur</th>

                    <th>Usia Kehamilan</th>

                    <th>Tanggal Persalinan</th>

                    <th>Keterangan</th>

                    <th>Aksi</th>

                </tr>

            </thead>


            <tbody>

            </tbody>

        </table>

    </div>

    <button
    type="button"
    class="btn-kembali"
    onclick="window.location.href='../dashboard/dashboard-nakes.html'">

    ⬅ Kembali ke Dashboard

</button>


</div>

<script
    type="module"
    src="../js/riwayat-persalinan.js">
</script>


</body>

</html>
