<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Riwayat Persalinan - SIAGA BUMIL
    </title>


    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard-nakes.css"
    >

</head>


<body>


    <!-- ==============================
         TOPBAR
    =============================== -->

    <header class="topbar">

        <div>

            <h2>
                🏥 SIAGA BUMIL
            </h2>

            <p>
                Riwayat Persalinan
            </p>

        </div>


        <button
            class="logout-btn"
            id="btnLogout"
        >

            Logout

        </button>

    </header>


    <!-- ==============================
         CONTAINER
    =============================== -->

    <main class="container">


        <!-- ==========================
             JUDUL
        =========================== -->

        <section class="page-header">

            <h1>
                📋 Riwayat Persalinan
            </h1>

            <p>
                Daftar ibu hamil yang telah
                menyelesaikan persalinan.
            </p>

        </section>


        <!-- ==========================
             SEARCH
        =========================== -->

        <section class="search-box">

            <input
                type="text"
                id="searchPersalinan"
                placeholder="🔎 Cari nama ibu..."
            >

        </section>


        <!-- ==========================
             TABLE
        =========================== -->

        <section class="chart-box">

            <div class="table-wrapper">

                <table
                    id="tabelPersalinan"
                >

                    <thead>

                        <tr>

                            <th>No</th>

                            <th>Nama Ibu</th>

                            <th>Umur</th>

                            <th>
                                Usia Kehamilan
                            </th>

                            <th>
                                Tanggal Persalinan
                            </th>

                            <th>
                                Keterangan
                            </th>

                            <th>
                                Aksi
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                    </tbody>

                </table>

            </div>

        </section>


    </main>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script
        type="module"
        src="../js/riwayat-persalinan.js"
    ></script>


</body>

</html>
